name: Commando Activity reusable publisher
on:
  workflow_call:
    secrets:
      read_user_token:
        description: Owner classic PAT with read:user
        required: true
permissions:
  contents: write
concurrency:
  group: commando-activity-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load pinned generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 0w1Max/commando-activity
          ref: v2.8.5
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Прочитать последнее опубликованное состояние
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs=require('fs');
            const {pathToFileURL}=require('url');
            const {readOutput}=await import(pathToFileURL(process.cwd()+'/src/publication/output-store.mjs'));
            const {owner,repo}=context.repo;
            const saved=await readOutput({github,owner,repo});
            fs.mkdirSync('generated',{recursive:true});
            fs.writeFileSync('generated/previous-state.json',JSON.stringify(saved.previous));
            fs.writeFileSync('generated/previous-ref.json',JSON.stringify({sha:saved.snapshot}));

      - name: Сгенерировать сегодняшнюю локацию и свежий календарь GitHub
        env:
          GH_TOKEN: ${{ secrets.read_user_token }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: node scripts/publish-daily.mjs --previous-state generated/previous-state.json

      - name: Проверить SVG и состояние перед публикацией
        run: node scripts/validate-daily.mjs generated/commando-activity.svg generated/commando-state.json

      - name: Атомарно опубликовать SVG и состояние в output
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs=require('fs');
            const {pathToFileURL}=require('url');
            const {publishOutput}=await import(pathToFileURL(process.cwd()+'/src/publication/output-store.mjs'));
            const {owner,repo}=context.repo;
            if(context.ref!==`refs/heads/${context.payload.repository.default_branch}`)throw new Error('Unexpected publication branch');
            const snapshot=JSON.parse(fs.readFileSync('generated/previous-ref.json','utf8')).sha;
            const state=JSON.parse(fs.readFileSync('generated/commando-state.json','utf8'));
            const result=await publishOutput({github,owner,repo,snapshot,sourceSha:context.sha,
              svg:fs.readFileSync('generated/commando-activity.svg','utf8'),state});
            core.info(`Published v${state.version}: ${state.date} ${state.location}; ${result.sha}`);
