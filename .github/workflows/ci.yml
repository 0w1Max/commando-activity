name: Test and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm test
      - run: npm run demo
      - run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('generated/commando-activity.svg')"
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v2.8.0
          path: reference
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated visual QA tools
        run: npm install --prefix "$RUNNER_TEMP/visual-qa" --no-save --no-package-lock playwright@1.56.1 sharp@0.34.5
      - name: Install browser engines
        run: node "$RUNNER_TEMP/visual-qa/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Compare all four locations against v2.8.0
        env:
          BROWSER_ENGINE: chromium
        run: NODE_PATH="$RUNNER_TEMP/visual-qa/node_modules" node tools/verify-rendering.cjs reference generated/chromium
      - name: Compare Safari engine at desktop and mobile sizes
        env:
          BROWSER_ENGINE: webkit
        run: NODE_PATH="$RUNNER_TEMP/visual-qa/node_modules" node tools/verify-rendering.cjs reference generated/webkit
  release:
    needs: [test, visual]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs=require('fs'),{owner,repo}=context.repo;
            const version=JSON.parse(fs.readFileSync('package.json','utf8')).version;
            if(!/^\d+\.\d+\.\d+$/.test(version))throw Error('Invalid version');
            const tag=`v${version}`;
            try{await github.rest.git.getRef({owner,repo,ref:`tags/${tag}`});}
            catch(e){if(e.status!==404)throw e;await github.rest.git.createRef({owner,repo,ref:`refs/tags/${tag}`,sha:context.sha});}
            try{await github.rest.repos.getReleaseByTag({owner,repo,tag});}
            catch(e){if(e.status!==404)throw e;await github.rest.repos.createRelease({owner,repo,tag_name:tag,name:`Commando Activity ${tag}`,body:'Standalone profile animation. English: README.md. Русский: README.ru.md. Code/art rights: ASSET_RIGHTS.md.',draft:false,prerelease:false});}
