name: Test and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:assets
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run demo
      - run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('generated/commando-activity.svg')"
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v2.8.1
          path: reference
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked QA tools
        run: npm ci --ignore-scripts
      - name: Install browser engines
        run: node node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Verify setup assistant language and generated output
        run: node tools/verify-setup.cjs
      - name: Compare all four locations against v2.8.1
        env:
          BROWSER_ENGINE: chromium
        run: node tools/verify-rendering.cjs reference generated/chromium
      - name: Compare Safari engine at desktop and mobile sizes
        env:
          BROWSER_ENGINE: webkit
        run: node tools/verify-rendering.cjs reference generated/webkit
      - name: Retain visual diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: visual-diagnostics
          path: generated/
          retention-days: 7
  release:
    concurrency:
      group: release
      cancel-in-progress: false
    needs: [test, visual]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs=require('fs'),{pathToFileURL}=require('url');
            const {publishRelease}=await import(pathToFileURL(process.cwd()+'/src/publication/release.mjs'));
            const {owner,repo}=context.repo;
            const version=JSON.parse(fs.readFileSync('package.json','utf8')).version;
            const result=await publishRelease({github,owner,repo,sha:context.sha,version,
              english:fs.readFileSync('CHANGELOG.md','utf8'),russian:fs.readFileSync('CHANGELOG.ru.md','utf8')});
            core.info(`Release verified: ${result.tag}`);
