name: Сообщить об ошибке (Русский)
description: Описать воспроизводимую проблему
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: 'Не публикуйте токены и приватные данные. Для проблем безопасности прочитайте SECURITY.ru.md.'
  - type: input
    id: version
    attributes:
      label: Версия
      placeholder: v2.8.4
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Шаги, ожидание и результат
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Устройство, ОС, браузер
  - type: textarea
    id: evidence
    attributes:
      label: Шаг ошибки или скриншот без секретов
