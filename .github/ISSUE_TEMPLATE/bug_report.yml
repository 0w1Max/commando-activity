name: Bug report (English)
description: Report a reproducible problem
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: 'Do not include tokens or private data. For security problems, read SECURITY.md.'
  - type: input
    id: version
    attributes:
      label: Release
      placeholder: v2.8.4
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected and actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, OS, browser
  - type: textarea
    id: evidence
    attributes:
      label: Failed step or screenshot without secrets
